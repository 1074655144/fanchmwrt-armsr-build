name: Build FanchmWrt (x86/ARM · bypass/router)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt
  REPO_BRANCH: fanchmwrt-25.12.4
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: 'true'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # x86_64 暂注释: 本次仅重编 armv8。fwx_user.ko 插件只在 x86_64/rockchip-armv8 等官方支持目标可用;
        # 如需恢复 x86_64 构建, 取消下面两行注释即可。
        # - { target: x86_64, mode: bypass, out: x86/64,       name: x86-64-bypass }
        # - { target: x86_64, mode: router, out: x86/64,       name: x86-64-router }
        - { target: armv8,  mode: bypass, out: armsr/armv8,  name: armv8-bypass }
        - { target: armv8,  mode: router, out: armsr/armv8,  name: armv8-router }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -hT $PWD

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl git-core libelf-dev \
            device-tree-compiler gperf intltool libglib2.0-dev xsltproc subversion \
            ccache ecj fastjar libltdl-dev libmpc-dev libmpfr-dev quilt \
            autoconf automake libtool sharutils bzip2 qemu-utils
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"

      - name: Clone source
        run: |
          git clone --depth 1 --branch "${{ env.REPO_BRANCH }}" "${{ env.REPO_URL }}" openwrt
          cd openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          echo "REVISION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Inject custom feeds (iStore etc.)
        run: |
          cp feeds.conf openwrt/feeds.conf
          echo "=== openwrt/feeds.conf ==="
          cat openwrt/feeds.conf

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config (${{ matrix.target }})
        run: |
          chmod +x gen-config.sh
          ./gen-config.sh ${{ matrix.target }} "$PWD/features.cfg"

      - name: Inject network-mode uci-defaults (${{ matrix.mode }})
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cp -r ../netmode/${{ matrix.mode }}/. files/
          chmod +x files/etc/uci-defaults/*

      - name: Run DIY part1
        run: |
          chmod +x "${{ env.DIY_P1_SH }}"
          cd openwrt
          "../${{ env.DIY_P1_SH }}"

      - name: Run DIY part2
        run: |
          chmod +x "${{ env.DIY_P2_SH }}"
          cd openwrt
          "../${{ env.DIY_P2_SH }}"

      - name: Download packages
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j$(nproc) V=s || make -j1 V=s

      - name: Check space & list output
        run: |
          cd openwrt
          df -hT $PWD
          echo "=== firmware (${{ matrix.out }}) ==="
          ls -lh bin/targets/${{ matrix.out }}/ || true

      - name: Upload firmware artifact
        if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: FanchmWrt-${{ matrix.name }}-${{ env.REVISION }}
          path: openwrt/bin/targets/${{ matrix.out }}/*
          retention-days: 14
